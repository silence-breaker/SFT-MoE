# ============================================================================
# LLaMA-Factory SFT 训练配置
# Qwen3-30B-A3B LoRA + DeepSpeed ZeRO-3 (8x A100 40GB)
# ============================================================================

### 模型
model_name_or_path: /app/model
trust_remote_code: true
### 训练方式
stage: sft
do_train: true
finetuning_type: lora

### LoRA 配置
lora_rank: 8
lora_alpha: 32
lora_target: all

### 数据集
dataset_dir: /app/data
dataset: oran_train
eval_dataset: oran_val
template: qwen3
cutoff_len: 2048
preprocessing_num_workers: 8

### 训练超参数
output_dir: /app/output
overwrite_output_dir: false
per_device_train_batch_size: 4
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
enable_liger_kernel: true
gradient_checkpointing: true

### 评估
eval_strategy: steps
eval_steps: 100

### 日志 & 保存
logging_steps: 5
save_steps: 100
save_total_limit: 5

### DeepSpeed ZeRO-3
deepspeed: /app/config/ds_z3_config.json

### 其他
dataloader_num_workers: 4
report_to: tensorboard
resume_from_checkpoint: true